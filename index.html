<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>email-usergen Android</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: #000000;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      color: #7E7E84;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-container {
      position: relative;
      flex: 1;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      height: 42px;
      background-color: #121214;
      border: 1px solid #232326;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      color: #FFFFFF;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #3A3A40;
    }

    .toggle-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
    }

    .toggle-icon:hover {
      opacity: 1;
    }

    button {
      height: 42px;
      background-color: #1B1B1E;
      border: 1px solid #28282D;
      border-radius: 8px;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    button:active {
      background-color: #121214;
      transform: scale(0.98);
    }

    .copy-btn {
      width: 76px;
      flex-shrink: 0;
    }

    .copy-btn.copied {
      background-color: #1E3322 !important;
      border: 1px solid #355E3B !important;
      color: #5AF07A !important;
    }

    .gen-btn {
      margin-top: 6px;
      height: 48px;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">email-usergen</div>

    <!-- Section 1: Username -->
    <div class="field-group">
      <div class="field-label">USERNAME</div>
      <div class="input-row">
        <div class="input-container">
          <input type="text" id="userInput" readonly placeholder="Generate to see username...">
        </div>
        <button class="copy-btn" onclick="copyValue('userInput', this)">Copy</button>
      </div>
    </div>

    <!-- Section 2: Email Address -->
    <div class="field-group">
      <div class="field-label">EMAIL ADDRESS</div>
      <div class="input-row">
        <div class="input-container">
          <input type="text" id="emailInput" readonly placeholder="Generate to see email...">
        </div>
        <button class="copy-btn" onclick="copyValue('emailInput', this)">Copy</button>
      </div>
    </div>

    <!-- Section 3: Secure Password -->
    <div class="field-group">
      <div class="field-label">SECURE PASSWORD</div>
      <div class="input-row">
        <div class="input-container">
          <input type="password" id="passInput" readonly placeholder="Generate to see password...">
          <div class="toggle-icon" id="eyeToggle" style="display: none;" onclick="togglePasswordVisibility()">
            <svg id="eyeSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <line id="eyeSlash" x1="1" y1="1" x2="23" y2="23" style="display: block;"></line>
            </svg>
          </div>
        </div>
        <button class="copy-btn" onclick="copyValue('passInput', this)">Copy</button>
      </div>
    </div>

    <!-- Generate All Button -->
    <button class="gen-btn" onclick="generateAll()">GENERATE ALL</button>
  </div>

  <script>
    function generateRandomString(length, chars) {
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function generateUsername(length = 10) {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      return generateRandomString(length, chars);
    }

    function generateEmail(length = 10) {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      const local = generateRandomString(length, chars);
      const domains = ["proton.me", "skiff.com", "tutanota.com", "duck.com", "gmail.com"];
      const randomDomain = domains[Math.floor(Math.random() * domains.length)];
      return `${local}@${randomDomain}`;
    }

    function generatePassword(length = 16) {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
      return generateRandomString(length, chars);
    }

    function generateAll() {
      document.getElementById('userInput').value = generateUsername();
      document.getElementById('emailInput').value = generateEmail();
      document.getElementById('passInput').value = generatePassword();
      document.getElementById('eyeToggle').style.display = 'flex';
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('passInput');
      const eyeSlash = document.getElementById('eyeSlash');
      
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeSlash.style.display = 'none';
      } else {
        passInput.type = 'password';
        eyeSlash.style.display = 'block';
      }
    }

    async function copyValue(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input.value) return;

      try {
        await navigator.clipboard.writeText(input.value);
      } catch (e) {
        input.select();
        document.execCommand('copy');
      }

      const originalText = btn.innerText;
      btn.innerText = 'Copied!';
      btn.classList.add('copied');

      setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.remove('copied');
      }, 1200);
    }
  </script>
</body>
</html>
